<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rasmiy Guruh Chati</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-body: #e2e8f0;
      --bg-app: #ffffff;
      --bg-chat: #f1f5f9;
      --bg-header: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --msg-me: #0284c7;
      --msg-me-text: #ffffff;
      --msg-friend: #ffffff;
      --msg-friend-text: #0f172a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    body.dark {
      --bg-body: #090d16;
      --bg-app: #111827;
      --bg-chat: #0b1120;
      --bg-header: #1e293b;
      --bg-input: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --msg-me: #0284c7;
      --msg-me-text: #ffffff;
      --msg-friend: #1e293b;
      --msg-friend-text: #f1f5f9;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 960px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      position: relative;
    }

    @media (min-width: 768px) {
      .app-container {
        height: 92dvh;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
    }

    .header {
      background: var(--bg-header);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white; font-weight: 700; display: flex;
      align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    }

    .title-area h2 { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-text { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
    .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    .header-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
    .icon-btn {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 7px 10px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 4px;
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    /* Hamma uchun doimiy ko'rinadigan Onlayn ishtirokchilar paneli */
    .online-strip {
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .online-strip::-webkit-scrollbar { display: none; }
    .strip-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      flex-shrink: 0;
    }
    .user-chip {
      background: var(--bg-input);
      border: 1px solid var(--border);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 5px #22c55e; }

    .admin-bar {
      background: rgba(16, 185, 129, 0.08);
      padding: 7px 16px;
      border-bottom: 1px solid var(--border);
      display: none;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      justify-content: space-between;
      flex-wrap: wrap;
    }
    .admin-bar.active { display: flex; }
    .admin-bar input {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 5px 8px; border-radius: 6px; outline: none; font-size: 12px; width: 110px;
    }
    .btn-sm {
      background: var(--primary); color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
    }

    #chat-box {
      flex: 1; background: var(--bg-chat); padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth;
    }

    .sys-msg {
      align-self: center; background: rgba(148, 163, 184, 0.18); color: var(--text-muted);
      font-size: 12px; padding: 5px 12px; border-radius: 20px; text-align: center; max-width: 90%;
    }
    .admin-alert {
      align-self: center; background: rgba(16, 185, 129, 0.16); color: #059669;
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-size: 12px; font-weight: 600; padding: 6px 14px; border-radius: 20px; text-align: center;
    }
    body.dark .admin-alert { color: #34d399; }

    .msg-row { display: flex; flex-direction: column; max-width: 84%; animation: fadeIn 0.2s ease; }
    @media (min-width: 768px) { .msg-row { max-width: 68%; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .msg-row.me { align-self: flex-end; align-items: flex-end; }
    .msg-row.friend { align-self: flex-start; align-items: flex-start; }

    .sender-name { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; padding: 0 4px; font-weight: 600; }
    .bubble-wrap { display: flex; align-items: center; gap: 4px; max-width: 100%; }
    .msg-row.me .bubble-wrap { flex-direction: row-reverse; }

    .bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4;
      word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.06); position: relative;
    }
    .me .bubble { background: var(--msg-me); color: var(--msg-me-text); border-bottom-right-radius: 4px; }
    .friend .bubble { background: var(--msg-friend); color: var(--msg-friend-text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

    /* Reply (Javob berish) bloki */
    .quoted-msg {
      background: rgba(0, 0, 0, 0.12);
      border-left: 3px solid #38bdf8;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.9;
    }
    .friend .quoted-msg { background: rgba(2, 132, 199, 0.08); border-left-color: var(--primary); }
    .quoted-sender { font-weight: 700; display: block; font-size: 11px; }

    /* Reaksiyalar */
    .reactions-bar {
      display: flex;
      gap: 4px;
      margin-top: 4px;
      flex-wrap: wrap;
    }
    .reaction-badge {
      background: var(--bg-header);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 7px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }

    .msg-actions { display: flex; flex-direction: column; gap: 2px; }
    .act-btn {
      background: transparent; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 13px; padding: 3px; border-radius: 6px;
      opacity: 0.6; transition: 0.15s;
    }
    .act-btn:hover { opacity: 1; background: rgba(148, 163, 184, 0.15); }
    .act-btn.del:hover { color: #ef4444; }

    .sticker-bubble {
      background: transparent !important; border: none !important; box-shadow: none !important; padding: 2px 6px !important;
    }
    .sticker-emoji { font-size: 64px; line-height: 1.1; display: block; }
    .sticker-bubble .msg-time { color: var(--text-muted); }

    .bubble img, .bubble video {
      max-width: 100%; max-height: 280px; border-radius: 10px; display: block; margin-bottom: 4px;
    }
    .bubble audio { max-width: 230px; height: 36px; display: block; margin-bottom: 4px; }

    .file-link {
      display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px;
      background: rgba(0, 0, 0, 0.12); color: inherit; text-decoration: none; font-size: 13px; font-weight: 500;
    }

    .msg-time { font-size: 10px; opacity: 0.75; margin-top: 4px; text-align: right; display: block; }

    /* Typing indikatori */
    .typing-bar {
      padding: 4px 16px;
      font-size: 12px;
      color: var(--primary);
      font-style: italic;
      background: var(--bg-chat);
      min-height: 22px;
    }

    /* Reply preview paneli */
    .reply-preview {
      background: var(--bg-header);
      border-top: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    .reply-preview.hidden { display: none; }
    .reply-preview-text { border-left: 3px solid var(--primary); padding-left: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .sticker-panel {
      background: var(--bg-header); border-top: 1px solid var(--border); padding: 10px 14px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
      gap: 6px; max-height: 180px; overflow-y: auto;
    }
    .sticker-panel.hidden { display: none; }
    .sticker-item {
      font-size: 32px; text-align: center; padding: 6px; border-radius: 12px;
      cursor: pointer; transition: 0.15s; user-select: none;
    }
    .sticker-item:hover { background: var(--bg-input); transform: scale(1.15); }

    .footer {
      background: var(--bg-header); padding: 10px 12px; border-top: 1px solid var(--border);
      display: flex; gap: 6px; align-items: center;
    }

    .media-btn {
      width: 38px; height: 38px; border-radius: 50%; background: var(--bg-input);
      border: 1px solid var(--border); color: var(--text-main); display: flex;
      align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; font-size: 17px;
    }
    .media-btn:hover { border-color: var(--primary); color: var(--primary); }
    .media-btn.recording { background: #ef4444; color: #fff; border-color: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .footer input[type="text"] {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      border-radius: 22px; padding: 10px 14px; font-size: 15px; width: 100%; outline: none;
    }
    .footer input[type="text"]:focus { border-color: var(--primary); }

    .send-btn {
      width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white;
      border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--bg-app); padding: 26px; border-radius: 18px; width: 100%;
      max-width: 360px; text-align: center; border: 1px solid var(--border);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .modal-box h3 { margin-bottom: 8px; font-size: 20px; }
    .modal-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }
    .modal-box input {
      width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text-main); text-align: center; font-size: 16px; margin-bottom: 12px;
      outline: none;
    }
    .modal-box input:focus { border-color: var(--primary); }
    .modal-box button { width: 100%; padding: 12px; font-size: 15px; }
    .admin-toggle {
      margin-top: 14px; font-size: 12px; color: var(--text-muted); cursor: pointer; display: inline-block;
    }
  </style>
</head>
<body>

  <!-- Ism kiritish oynasi -->
  <div class="modal-overlay" id="name-modal">
    <div class="modal-box">
      <h3>👋 Chatga xush kelibsiz!</h3>
      <p>Guruh ishtirokchilari sizni tanishi uchun ismingizni kiriting:</p>
      <input type="text" id="username-input" placeholder="Ismingizni yozing..." maxlength="25" onkeypress="if(event.key==='Enter') joinGroup()">
      <button class="btn-sm" onclick="joinGroup()">Chatga kirish</button>
      <div class="admin-toggle" onclick="activateAdmin()" id="admin-status-link">👑 Admin kirishi</div>
    </div>
  </div>

  <div class="app-container">
    <!-- Sarlavha -->
    <div class="header">
      <div class="user-info">
        <div class="avatar" id="header-avatar">G</div>
        <div class="title-area">
          <h2 id="room-title">Rasmiy Guruh</h2>
          <div class="status-text">
            <span class="dot" id="status-dot"></span>
            <span id="status-label">Ulanmoqda...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="changeMyName()" title="Ismni o'zgartirish">✏️ <span id="my-name-badge">Ism</span></button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn" title="Mavzu">🌙</button>
      </div>
    </div>

    <!-- Hamma uchun ko'rinadigan Onlayn ishtirokchilar ro'yxati -->
    <div class="online-strip" id="online-strip">
      <span class="strip-label">🟢 Onlayn (<span id="online-count">1</span>):</span>
      <div id="online-users-list" style="display:flex; gap:6px;"></div>
    </div>

    <!-- Admin paneli -->
    <div class="admin-bar" id="admin-bar">
      <span>👑 Admin nazorati</span>
      <div style="display:flex; gap:5px; flex-wrap:wrap;">
        <input type="text" id="room-input" value="umumiy" placeholder="Xona">
        <button class="btn-sm" style="padding:4px 8px; font-size:12px;" onclick="switchRoom()">O‘tish</button>
        <button class="btn-sm" style="padding:4px 8px; font-size:12px; background:#ef4444;" onclick="clearChatHistory()">Tarixni tozalash</button>
      </div>
    </div>

    <!-- Xabarlar maydoni -->
    <div id="chat-box"></div>

    <!-- Kim yozayotganini ko'rsatish -->
    <div class="typing-bar" id="typing-bar"></div>

    <!-- Reply (Javob berish) oynasi -->
    <div class="reply-preview hidden" id="reply-preview">
      <div class="reply-preview-text">
        <strong id="reply-to-name" style="color:var(--primary); font-size:11px;"></strong>
        <div id="reply-to-text" style="color:var(--text-muted); font-size:12px;"></div>
      </div>
      <button class="act-btn" onclick="cancelReply()" style="font-size:16px;">✖</button>
    </div>

    <!-- Stikerlar paneli -->
    <div class="sticker-panel hidden" id="sticker-panel"></div>

    <!-- Xabar yozish qismi -->
    <div class="footer">
      <input type="file" id="file-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip" style="display:none" onchange="handleFileUpload(event)">
      <button class="media-btn" onclick="document.getElementById('file-input').click()" title="Rasm, Video yoki Fayl">📎</button>
      <button class="media-btn" onclick="toggleStickers()" title="Stikerlar">😊</button>
      <button class="media-btn" id="mic-btn" onclick="toggleVoiceRecord()" title="Ovozli xabar">🎤</button>

      <input type="text" id="msg" placeholder="Xabar yozing..." autocomplete="off" oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendTextMsg()">
      <button class="send-btn" onclick="sendTextMsg()" title="Yuborish">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <script>
    const ADMIN_PASS = "2026";
    const TOPIC_PREFIX = "suxrob_live_group_chat_2026/";
    let isAdmin = localStorage.getItem("chat_is_admin") === "true";

    let myName = localStorage.getItem("chat_user_name") || "";
    let myClientId = sessionStorage.getItem("chat_tab_id");
    if (!myClientId) {
      myClientId = "usr_" + Date.now() + "_" + Math.random().toString(36).substring(2, 7);
      sessionStorage.setItem("chat_tab_id", myClientId);
    }

    let currentRoom = localStorage.getItem("chat_room") || "umumiy";
    let client = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let replyContext = null;
    let lastTypingSent = 0;
    let typingUsers = {};

    // Faqat hozir onlayn turgan foydalanuvchilar ro'yxati
    let activeUsers = {};
    let messageHistory = JSON.parse(localStorage.getItem("chat_history_" + currentRoom) || "[]");

    const stickers = [
      "😀", "😂", "🤣", "😍", "🥰", "😎", "🤩", "🥳",
      "😭", "😱", "😡", "🤔", "😴", "🤯", "🫡", "🤗",
      "👍", "👎", "👏", "🙌", "🤝", "🔥", "❤️", "💔",
      "💯", "🎉", "🚀", "⚡", "👑", "⚽", "🏆", "🌹"
    ];

    const chatBox = document.getElementById("chat-box");
    const statusDot = document.getElementById("status-dot");
    const statusLabel = document.getElementById("status-label");

    // Stikerlarni chizish
    const stickerPanel = document.getElementById("sticker-panel");
    stickers.forEach(emoji => {
      const span = document.createElement("div");
      span.className = "sticker-item";
      span.innerText = emoji;
      span.onclick = () => sendSticker(emoji);
      stickerPanel.appendChild(span);
    });

    if (localStorage.getItem("chat_theme") === "dark") {
      document.body.classList.add("dark");
      document.getElementById("theme-btn").innerText = "☀️";
    }

    updateAdminUI();

    if (myName) {
      document.getElementById("name-modal").classList.add("hidden");
      startChat();
    } else {
      document.getElementById("username-input").focus();
    }

    function activateAdmin() {
      const pass = prompt("Admin parolini kiriting:");
      if (pass === ADMIN_PASS) {
        isAdmin = true;
        localStorage.setItem("chat_is_admin", "true");
        updateAdminUI();
        alert("Admin rejimi yoqildi!");
      } else if (pass !== null) {
        alert("Parol noto‘g‘ri!");
      }
    }

    function updateAdminUI() {
      const bar = document.getElementById("admin-bar");
      const link = document.getElementById("admin-status-link");
      if (isAdmin) {
        bar.classList.add("active");
        if (link) link.innerText = "✅ Admin tasdiqlandi";
      }
    }

    function joinGroup() {
      const val = document.getElementById("username-input").value.trim();
      if (val.length < 2) {
        alert("Iltimos, kamida 2 ta harfdan iborat ismingizni yozing!");
        return;
      }
      myName = val;
      localStorage.setItem("chat_user_name", myName);
      document.getElementById("name-modal").classList.add("hidden");
      startChat();
    }

    function changeMyName() {
      const newName = prompt("Yangi ismingizni kiriting:", myName);
      if (newName && newName.trim().length >= 2) {
        const oldName = myName;
        myName = newName.trim();
        localStorage.setItem("chat_user_name", myName);
        updateMyHeaderUI();
        activeUsers[myClientId] = { name: myName, lastSeen: Date.now() };
        renderOnlineUsers();
        announcePresence("join");
        publishSystemNotice(`${oldName} ismini "${myName}" ga o‘zgartirdi`);
      }
    }

    function updateMyHeaderUI() {
      document.getElementById("header-avatar").innerText = myName.charAt(0).toUpperCase();
      document.getElementById("my-name-badge").innerText = myName;
    }

    function toggleStickers() {
      stickerPanel.classList.toggle("hidden");
    }

    function startChat() {
      updateMyHeaderUI();
      activeUsers[myClientId] = { name: myName, lastSeen: Date.now() };
      renderOnlineUsers();
      loadSavedHistory();

      if (client) return;

      // Chiqib ketayotganda boshqalarga xabar berish (Last Will)
      client = mqtt.connect("wss://broker.emqx.io:8084/mqtt", {
        will: {
          topic: TOPIC_PREFIX + currentRoom.toLowerCase(),
          payload: JSON.stringify({ type: "leave", clientId: myClientId, sender: myName }),
          qos: 0,
          retain: false
        }
      });

      client.on("connect", () => {
        statusDot.classList.add("online");
        statusLabel.innerText = "Onlayn";
        subscribeRoom(currentRoom);
      });

      client.on("reconnect", () => {
        statusDot.classList.remove("online");
        statusLabel.innerText = "Qayta ulanmoqda...";
      });

      client.on("message", (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());

          // 1. Foydalanuvchi chiqib ketdi
          if (data.type === "leave") {
            if (activeUsers[data.clientId]) {
              const leftName = activeUsers[data.clientId].name;
              delete activeUsers[data.clientId];
              renderOnlineUsers();
              addSysMsg(`${leftName} chatdan chiqdi`);
            }
            return;
          }

          // 2. Kimlar onlayn ekanligini aniqlash (Presence)
          if (data.type === "presence") {
            if (data.clientId === myClientId) return;
            const isNewArrival = !activeUsers[data.clientId];
            activeUsers[data.clientId] = { name: data.sender, lastSeen: Date.now() };
            renderOnlineUsers();

            // Yangi odam kirganda unga o'zimizni ko'rsatamiz va hammaga bildiramiz
            if (data.action === "join" || isNewArrival) {
              announcePresence("pong");
              if (data.action === "join") {
                addSysMsg(`🟢 ${data.sender} chatga qo‘shildi`);
                playBeep();
              }
            }
            return;
          }

          // 3. Yozmoqda... (Typing)
          if (data.type === "typing") {
            if (data.clientId === myClientId) return;
            typingUsers[data.sender] = Date.now();
            updateTypingUI();
            return;
          }

          // 4. Xabar o'chirish
          if (data.type === "delete") {
            const targetRow = document.getElementById("msg_" + data.msgId);
            if (targetRow) targetRow.remove();
            removeFromHistory(data.msgId);
            return;
          }

          // 5. Reaksiya qo'shish
          if (data.type === "reaction") {
            applyReactionUI(data.msgId, data.emoji);
            return;
          }

          // 6. Tizim xabari (ism o'zgarishi va h.k.)
          if (data.type === "sys") {
            if (data.clientId !== myClientId) addSysMsg(data.content);
            return;
          }

          // 7. Oddiy yoki media xabar
          if (data.clientId === myClientId) return;

          // Xabar yuborgan odamni ham onlayn ro'yxatida yangilab qo'yamiz
          activeUsers[data.clientId] = { name: data.sender, lastSeen: Date.now() };
          renderOnlineUsers();

          delete typingUsers[data.sender];
          updateTypingUI();

          renderMessage(data, "friend");
          saveToHistory(data);
          playBeep();
        } catch (e) {}
      });

      // Har 6 soniyada "men onlaynman" signali yuborish va 18 soniya jim qolganlarni o'chirish
      setInterval(() => {
        if (client && client.connected) {
          activeUsers[myClientId] = { name: myName, lastSeen: Date.now() };
          announcePresence("ping");
        }
        const now = Date.now();
        let listChanged = false;
        for (const id in activeUsers) {
          if (id !== myClientId && now - activeUsers[id].lastSeen > 18000) {
            delete activeUsers[id];
            listChanged = true;
          }
        }
        if (listChanged) renderOnlineUsers();
        updateTypingUI();
      }, 6000);
    }

    window.addEventListener("beforeunload", () => {
      if (client && client.connected && myName) {
        client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
          type: "leave",
          clientId: myClientId,
          sender: myName
        }));
      }
    });

    function announcePresence(action) {
      if (!client || !client.connected || !myName) return;
      client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
        type: "presence",
        action: action,
        clientId: myClientId,
        sender: myName
      }));
    }

    // Hamma ishtirokchilarga ko'rinadigan onlayn ro'yxatni chizish
    function renderOnlineUsers() {
      const container = document.getElementById("online-users-list");
      const countEl = document.getElementById("online-count");
      container.innerHTML = "";

      const ids = Object.keys(activeUsers);
      countEl.innerText = ids.length;

      ids.forEach(id => {
        const user = activeUsers[id];
        const chip = document.createElement("div");
        chip.className = "user-chip";
        const isMe = id === myClientId;
        chip.innerHTML = `<span class="online-dot"></span><span>${user.name}${isMe ? " (Siz)" : ""}</span>`;
        container.appendChild(chip);
      });
    }

    function handleTyping() {
      const now = Date.now();
      if (now - lastTypingSent > 2500 && client && client.connected) {
        lastTypingSent = now;
        client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
          type: "typing",
          clientId: myClientId,
          sender: myName
        }));
      }
    }

    function updateTypingUI() {
      const now = Date.now();
      const activeTypers = [];
      for (const name in typingUsers) {
        if (now - typingUsers[name] < 3500) {
          activeTypers.push(name);
        } else {
          delete typingUsers[name];
        }
      }
      const bar = document.getElementById("typing-bar");
      if (activeTypers.length === 1) {
        bar.innerText = `${activeTypers[0]} yozmoqda...`;
      } else if (activeTypers.length > 1) {
        bar.innerText = `${activeTypers.join(", ")} yozmoqda...`;
      } else {
        bar.innerText = "";
      }
    }

    function subscribeRoom(roomName) {
      const topic = TOPIC_PREFIX + roomName.toLowerCase();
      client.subscribe(topic);
      document.getElementById("room-title").innerText = "Guruh: #" + roomName;
      announcePresence("join");
      addSysMsg(`Siz "${roomName}" chatiga kirdingiz.`);
    }

    function switchRoom() {
      if (!isAdmin) return;
      const newRoom = document.getElementById("room-input").value.trim().replace(/\s+/g, "_");
      if (!newRoom || newRoom === currentRoom) return;
      client.unsubscribe(TOPIC_PREFIX + currentRoom.toLowerCase());
      currentRoom = newRoom;
      localStorage.setItem("chat_room", currentRoom);
      activeUsers = { [myClientId]: { name: myName, lastSeen: Date.now() } };
      renderOnlineUsers();
      chatBox.innerHTML = "";
      messageHistory = JSON.parse(localStorage.getItem("chat_history_" + currentRoom) || "[]");
      loadSavedHistory();
      subscribeRoom(currentRoom);
    }

    function getTimeNow() {
      const now = new Date();
      return now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");
    }

    function publishSystemNotice(text) {
      addSysMsg(text);
      if (client && client.connected) {
        client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
          type: "sys",
          clientId: myClientId,
          content: text
        }));
      }
    }

    function publishPayload(dataObj) {
      if (!client || !client.connected) {
        alert("Serverga ulanish kutilmoqda...");
        return false;
      }
      dataObj.msgId = Date.now() + "_" + Math.random().toString(36).substring(2, 6);
      dataObj.clientId = myClientId;
      dataObj.sender = myName;
      dataObj.time = getTimeNow();
      if (replyContext) {
        dataObj.replyTo = replyContext;
        cancelReply();
      }
      client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify(dataObj));
      renderMessage(dataObj, "me");
      saveToHistory(dataObj);
      return true;
    }

    // Xabarlar tarixini saqlash va yuklash
    function saveToHistory(msgObj) {
      // Juda katta media fayllarni localStorage to'lib qolmasligi uchun cheklaymiz
      if (msgObj.content && msgObj.content.length > 200000) return;
      messageHistory.push(msgObj);
      if (messageHistory.length > 60) messageHistory.shift();
      try {
        localStorage.setItem("chat_history_" + currentRoom, JSON.stringify(messageHistory));
      } catch (e) {}
    }

    function removeFromHistory(msgId) {
      messageHistory = messageHistory.filter(m => m.msgId !== msgId);
      localStorage.setItem("chat_history_" + currentRoom, JSON.stringify(messageHistory));
    }

    function loadSavedHistory() {
      messageHistory.forEach(msg => {
        const who = msg.sender === myName ? "me" : "friend";
        renderMessage(msg, who);
      });
    }

    function clearChatHistory() {
      if (!isAdmin) return;
      if (!confirm("Lokal xabarlar tarixini tozalaysizmi?")) return;
      messageHistory = [];
      localStorage.removeItem("chat_history_" + currentRoom);
      chatBox.innerHTML = "";
      addSysMsg("Xabarlar tarixi tozalandi.");
    }

    function setReply(sender, previewText) {
      replyContext = { sender: sender, text: previewText.substring(0, 60) };
      document.getElementById("reply-to-name").innerText = "↩️ " + sender;
      document.getElementById("reply-to-text").innerText = replyContext.text;
      document.getElementById("reply-preview").classList.remove("hidden");
      document.getElementById("msg").focus();
    }

    function cancelReply() {
      replyContext = null;
      document.getElementById("reply-preview").classList.add("hidden");
    }

    function sendReaction(msgId, emoji) {
      applyReactionUI(msgId, emoji);
      if (client && client.connected) {
        client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
          type: "reaction",
          msgId: msgId,
          emoji: emoji
        }));
      }
    }

    function applyReactionUI(msgId, emoji) {
      const bar = document.getElementById("react_" + msgId);
      if (!bar) return;
      let badge = bar.querySelector(`[data-emoji="${emoji}"]`);
      if (badge) {
        const countSpan = badge.querySelector(".r-cnt");
        countSpan.innerText = parseInt(countSpan.innerText) + 1;
      } else {
        badge = document.createElement("span");
        badge.className = "reaction-badge";
        badge.setAttribute("data-emoji", emoji);
        badge.innerHTML = `${emoji} <span class="r-cnt">1</span>`;
        badge.onclick = () => sendReaction(msgId, emoji);
        bar.appendChild(badge);
      }
    }

    function deleteMessage(msgId) {
      if (!confirm("Bu xabarni hamma uchun o‘chirasizmi?")) return;
      const el = document.getElementById("msg_" + msgId);
      if (el) el.remove();
      removeFromHistory(msgId);
      if (client && client.connected) {
        client.publish(TOPIC_PREFIX + currentRoom.toLowerCase(), JSON.stringify({
          type: "delete",
          msgId: msgId
        }));
      }
    }

    function sendTextMsg() {
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (!text) return;
      if (publishPayload({ type: "text", content: text })) {
        input.value = "";
        input.focus();
      }
    }

    function sendSticker(emoji) {
      publishPayload({ type: "sticker", content: emoji });
      stickerPanel.classList.add("hidden");
    }

    async function toggleVoiceRecord() {
      const micBtn = document.getElementById("mic-btn");
      if (!isRecording) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          mediaRecorder = new MediaRecorder(stream);
          audioChunks = [];
          mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
          mediaRecorder.onstop = () => {
            const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
            const reader = new FileReader();
            reader.onloadend = () => publishPayload({ type: "audio", content: reader.result });
            reader.readAsDataURL(audioBlob);
            stream.getTracks().forEach(track => track.stop());
          };
          mediaRecorder.start();
          isRecording = true;
          micBtn.classList.add("recording");
          micBtn.innerText = "⏹️";
        } catch (err) {
          alert("Mikrofonga ruxsat berilmadi.");
        }
      } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.classList.remove("recording");
        micBtn.innerText = "🎤";
      }
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) {
        alert("Fayl hajmi 1.5 MB dan oshmasligi kerak!");
        event.target.value = "";
        return;
      }
      if (file.type.startsWith("image/")) {
        compressImage(file, (base64Img) => publishPayload({ type: "image", content: base64Img }));
      } else if (file.type.startsWith("video/")) {
        const reader = new FileReader();
        reader.onload = () => publishPayload({ type: "video", content: reader.result });
        reader.readAsDataURL(file);
      } else {
        const reader = new FileReader();
        reader.onload = () => publishPayload({ type: "file", content: reader.result, fileName: file.name });
        reader.readAsDataURL(file);
      }
      event.target.value = "";
    }

    function compressImage(file, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const maxW = 800;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          callback(canvas.toDataURL("image/jpeg", 0.75));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderMessage(data, who) {
      const row = document.createElement("div");
      row.className = "msg-row " + who;
      if (data.msgId) row.id = "msg_" + data.msgId;

      const nameEl = document.createElement("div");
      nameEl.className = "sender-name";
      nameEl.innerText = who === "me" ? `${myName} (Siz)` : data.sender;

      const bubbleWrap = document.createElement("div");
      bubbleWrap.className = "bubble-wrap";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      // Reply qilingan xabar bo'lsa ko'rsatish
      if (data.replyTo) {
        const qBox = document.createElement("div");
        qBox.className = "quoted-msg";
        qBox.innerHTML = `<span class="quoted-sender">${data.replyTo.sender}</span>${data.replyTo.text}`;
        bubble.appendChild(qBox);
      }

      let summaryText = "Media xabar";
      if (data.type === "sticker") {
        bubble.classList.add("sticker-bubble");
        const span = document.createElement("span");
        span.className = "sticker-emoji";
        span.innerText = data.content;
        bubble.appendChild(span);
        summaryText = data.content;
      } else if (data.type === "image") {
        const img = document.createElement("img");
        img.src = data.content;
        bubble.appendChild(img);
        summaryText = "🖼️ Rasm";
      } else if (data.type === "video") {
        const vid = document.createElement("video");
        vid.src = data.content;
        vid.controls = true;
        vid.playsInline = true;
        bubble.appendChild(vid);
        summaryText = "🎥 Video";
      } else if (data.type === "audio") {
        const aud = document.createElement("audio");
        aud.src = data.content;
        aud.controls = true;
        bubble.appendChild(aud);
        summaryText = "🎤 Ovozli xabar";
      } else if (data.type === "file") {
        const a = document.createElement("a");
        a.href = data.content;
        a.download = data.fileName || "fayl";
        a.className = "file-link";
        a.innerText = "📄 " + (data.fileName || "Faylni yuklab olish");
        bubble.appendChild(a);
        summaryText = "📄 " + (data.fileName || "Fayl");
      } else {
        const p = document.createElement("span");
        p.innerText = data.content;
        bubble.appendChild(p);
        summaryText = data.content;
      }

      const timeEl = document.createElement("span");
      timeEl.className = "msg-time";
      timeEl.innerText = data.time;
      bubble.appendChild(timeEl);

      bubbleWrap.appendChild(bubble);

      // Xabar yonidagi tugmalar (Javob berish, Reaksiya, O'chirish)
      if (data.msgId) {
        const actionsDiv = document.createElement("div");
        actionsDiv.className = "msg-actions";

        const replyBtn = document.createElement("button");
        replyBtn.className = "act-btn";
        replyBtn.innerText = "↩️";
        replyBtn.title = "Javob berish";
        replyBtn.onclick = () => setReply(data.sender, summaryText);
        actionsDiv.appendChild(replyBtn);

        const likeBtn = document.createElement("button");
        likeBtn.className = "act-btn";
        likeBtn.innerText = "❤️";
        likeBtn.title = "Reaksiya";
        likeBtn.onclick = () => sendReaction(data.msgId, "❤️");
        actionsDiv.appendChild(likeBtn);

        if (who === "me" || isAdmin) {
          const delBtn = document.createElement("button");
          delBtn.className = "act-btn del";
          delBtn.innerText = "🗑️";
          delBtn.title = "O‘chirish";
          delBtn.onclick = () => deleteMessage(data.msgId);
          actionsDiv.appendChild(delBtn);
        }

        bubbleWrap.appendChild(actionsDiv);
      }

      const reactBar = document.createElement("div");
      reactBar.className = "reactions-bar";
      if (data.msgId) reactBar.id = "react_" + data.msgId;

      row.appendChild(nameEl);
      row.appendChild(bubbleWrap);
      row.appendChild(reactBar);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSysMsg(text) {
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      document.getElementById("theme-btn").innerText = isDark ? "☀️" : "🌙";
      localStorage.setItem("chat_theme", isDark ? "dark" : "light");
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }
  </script>
</body>
</html>
