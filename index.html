<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ideal Veb Chat</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    :root {
      --bg-body: #e2e8f0;
      --bg-app: #ffffff;
      --bg-chat: #f1f5f9;
      --bg-header: #ffffff;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --msg-me: #0284c7;
      --msg-me-text: #ffffff;
      --msg-friend: #ffffff;
      --msg-friend-text: #0f172a;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    body.dark {
      --bg-body: #090d16;
      --bg-app: #111827;
      --bg-chat: #0b1120;
      --bg-header: #1e293b;
      --bg-input: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --msg-me: #0284c7;
      --msg-me-text: #ffffff;
      --msg-friend: #1e293b;
      --msg-friend-text: #f1f5f9;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      height: 100dvh;
      background: var(--bg-app);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 92dvh;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
    }

    .header {
      background: var(--bg-header);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .user-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: white; font-weight: 700; display: flex;
      align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
    }

    .title-area h2 { font-size: 16px; font-weight: 600; }
    .status-text { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; display: inline-block; }
    .dot.online { background: #22c55e; box-shadow: 0 0 6px #22c55e; }

    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .icon-btn {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 7px 11px; border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 500;
    }
    .icon-btn:hover { border-color: var(--primary); color: var(--primary); }

    .room-bar {
      background: var(--bg-header);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .room-bar input {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 10px; border-radius: 8px; outline: none; font-size: 13px; max-width: 180px;
    }
    .btn-sm {
      background: var(--primary); color: #fff; border: none; padding: 6px 12px;
      border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px;
    }

    #chat-box {
      flex: 1; background: var(--bg-chat); padding: 16px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }

    .sys-msg {
      align-self: center; background: rgba(148, 163, 184, 0.18); color: var(--text-muted);
      font-size: 12px; padding: 5px 12px; border-radius: 20px; text-align: center;
    }

    .msg-row { display: flex; flex-direction: column; max-width: 80%; animation: fadeIn 0.2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .msg-row.me { align-self: flex-end; align-items: flex-end; }
    .msg-row.friend { align-self: flex-start; align-items: flex-start; }

    .sender-name { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; padding: 0 4px; }
    .bubble {
      padding: 10px 14px; border-radius: 16px; font-size: 15px; line-height: 1.4;
      word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }
    .me .bubble { background: var(--msg-me); color: var(--msg-me-text); border-bottom-right-radius: 4px; }
    .friend .bubble { background: var(--msg-friend); color: var(--msg-friend-text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }

    .msg-time { font-size: 10px; opacity: 0.75; margin-top: 4px; text-align: right; display: block; }

    .footer {
      background: var(--bg-header); padding: 10px 14px; border-top: 1px solid var(--border);
      display: flex; gap: 8px; align-items: center;
    }
    .footer input {
      background: var(--bg-input); border: 1px solid var(--border); color: var(--text-main);
      border-radius: 22px; padding: 11px 16px; font-size: 15px; width: 100%; outline: none;
    }
    .footer input:focus { border-color: var(--primary); }
    .send-btn {
      width: 44px; height: 44px; border-radius: 50%; background: var(--primary); color: white;
      border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
    }

    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--bg-app); padding: 24px; border-radius: 16px; width: 100%;
      max-width: 350px; text-align: center; border: 1px solid var(--border);
    }
    .modal-box h3 { margin-bottom: 8px; }
    .modal-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
    .modal-box input {
      width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text-main); text-align: center; font-size: 16px; margin-bottom: 12px;
    }
    .modal-box button { width: 100%; padding: 11px; }
  </style>
</head>
<body>

  <div class="modal-overlay" id="name-modal">
    <div class="modal-box">
      <h3>Chatga xush kelibsiz</h3>
      <p>Ismingizni kiriting</p>
      <input type="text" id="username-input" placeholder="Masalan: Suxrob" maxlength="20" onkeypress="if(event.key==='Enter') saveUsername()">
      <button class="btn-sm" onclick="saveUsername()">Kirish</button>
    </div>
  </div>

  <div class="app-container">
    <div class="header">
      <div class="user-info">
        <div class="avatar" id="header-avatar">S</div>
        <div class="title-area">
          <h2 id="room-title">Umumiy Chat</h2>
          <div class="status-text">
            <span class="dot" id="status-dot"></span>
            <span id="status-label">Ulanmoqda...</span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="changeName()">✏️ Ism</button>
        <button class="icon-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
      </div>
    </div>

    <div class="room-bar">
      <span>Xona:</span>
      <input type="text" id="room-input" value="umumiy" placeholder="Xona nomi">
      <button class="btn-sm" onclick="switchRoom()">O‘tish</button>
    </div>

    <div id="chat-box"></div>

    <div class="footer">
      <input type="text" id="msg" placeholder="Xabar yozing..." autocomplete="off" onkeypress="if(event.key==='Enter') sendMsg()">
      <button class="send-btn" onclick="sendMsg()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
      </button>
    </div>
  </div>

  <script>
    let myName = localStorage.getItem("chat_username") || "";
    const myClientId = "user_" + Math.random().toString(36).substring(2, 10);
    let currentRoom = "umumiy";
    let client = null;

    const chatBox = document.getElementById("chat-box");
    const statusDot = document.getElementById("status-dot");
    const statusLabel = document.getElementById("status-label");

    if (localStorage.getItem("chat_theme") === "dark") {
      document.body.classList.add("dark");
      document.getElementById("theme-btn").innerText = "☀️";
    }

    if (myName) {
      document.getElementById("name-modal").classList.add("hidden");
      startChat();
    }

    function saveUsername() {
      const val = document.getElementById("username-input").value.trim();
      myName = val || "Mehmon";
      localStorage.setItem("chat_username", myName);
      document.getElementById("name-modal").classList.add("hidden");
      startChat();
    }

    function changeName() {
      localStorage.removeItem("chat_username");
      document.getElementById("username-input").value = myName;
      document.getElementById("name-modal").classList.remove("hidden");
    }

    function startChat() {
      document.getElementById("header-avatar").innerText = myName.charAt(0).toUpperCase();
      if (client) return;

      // Bepul va tezkor WebSocket MQTT broker (hech qanday kalitsiz ishlaydi)
      client = mqtt.connect("wss://broker.emqx.io:8084/mqtt");

      client.on("connect", () => {
        statusDot.classList.add("online");
        statusLabel.innerText = "Onlayn";
        subscribeRoom(currentRoom);
      });

      client.on("reconnect", () => {
        statusDot.classList.remove("online");
        statusLabel.innerText = "Qayta ulanmoqda...";
      });

      client.on("message", (topic, payload) => {
        try {
          const data = JSON.parse(payload.toString());
          if (data.clientId === myClientId) return; // O'zimiz yuborgan xabarni ikki marta chiqarmaslik
          addMessage(data.text, "friend", data.sender, data.time);
          playBeep();
        } catch (e) {}
      });
    }

    function subscribeRoom(roomName) {
      const topic = "suxrob_veb_chat_2026/" + roomName.toLowerCase();
      client.subscribe(topic);
      document.getElementById("room-title").innerText = "Xona: #" + roomName;
      addSysMsg(`"${roomName}" xonasiga ulandingiz. Shu xonadagi hamma xabarlaringizni ko‘radi.`);
    }

    function switchRoom() {
      const newRoom = document.getElementById("room-input").value.trim().replace(/\s+/g, "_");
      if (!newRoom || newRoom === currentRoom) return;
      client.unsubscribe("suxrob_veb_chat_2026/" + currentRoom.toLowerCase());
      currentRoom = newRoom;
      chatBox.innerHTML = "";
      subscribeRoom(currentRoom);
    }

    function sendMsg() {
      const input = document.getElementById("msg");
      const text = input.value.trim();
      if (!text) return;

      if (!client || !client.connected) {
        alert("Internetga ulanish kutilmoqda...");
        return;
      }

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, "0") + ":" + now.getMinutes().toString().padStart(2, "0");

      const payload = JSON.stringify({
        clientId: myClientId,
        sender: myName,
        text: text,
        time: timeStr
      });

      client.publish("suxrob_veb_chat_2026/" + currentRoom.toLowerCase(), payload);
      addMessage(text, "me", myName, timeStr);
      input.value = "";
      input.focus();
    }

    function addMessage(text, who, sender, time) {
      const row = document.createElement("div");
      row.className = "msg-row " + who;

      const nameEl = document.createElement("div");
      nameEl.className = "sender-name";
      nameEl.innerText = who === "me" ? "Siz" : sender;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerText = text;

      const timeEl = document.createElement("span");
      timeEl.className = "msg-time";
      timeEl.innerText = time;

      bubble.appendChild(timeEl);
      row.appendChild(nameEl);
      row.appendChild(bubble);
      chatBox.appendChild(row);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function addSysMsg(text) {
      const div = document.createElement("div");
      div.className = "sys-msg";
      div.innerText = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
      const isDark = document.body.classList.contains("dark");
      document.getElementById("theme-btn").innerText = isDark ? "☀️" : "🌙";
      localStorage.setItem("chat_theme", isDark ? "dark" : "light");
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(600, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }
  </script>
</body>
</html>
